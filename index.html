<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProPresenter 7 Song Editor (Web)</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0f1b2d">
</head>
<body>
  <header class="app-header">
    <h1>ProPresenter 7 Song Editor</h1>
    <p class="subtitle">Web version — generates .pro files in your browser</p>
  </header>

  <main>
    <section class="toolbar">
      <div class="toolbar-row">
        <label>Song Name:
          <input id="song-name" type="text" placeholder="My Song" value="">
        </label>
        <label>Lines per Slide:
          <input id="line-count" type="number" min="1" max="10" value="2" style="width:60px">
        </label>
        <label>Arrangement:
          <input id="arrangement" type="text" value="Verse 1, Chorus, Verse 2, Chorus" style="width:320px">
        </label>
        <button id="btn-open" class="btn">Open JSON</button>
        <button id="btn-save" class="btn btn-primary">Save (.pro + .json)</button>
        <button id="btn-single" class="btn btn-secondary">Download as Single</button>
      </div>
      <input type="file" id="file-open" accept=".json" style="display:none">
    </section>

    <nav class="tabs">
      <button class="tab active" data-tab="translate">Translate View</button>
      <button class="tab" data-tab="single">Single View</button>
      <button class="tab" data-tab="groups">Edit Group Names</button>
    </nav>

    <section id="tab-translate" class="tab-content active">
      <div class="editor-grid" id="translate-grid">
        <!-- Columns populated by JS -->
      </div>
    </section>

    <section id="tab-single" class="tab-content">
      <div class="editor-grid single-grid">
        <div class="col-numbers" id="single-numbers"></div>
        <div class="col-text" id="single-text-col">
          <textarea id="single-text" spellcheck="false"></textarea>
        </div>
      </div>
    </section>

    <section id="tab-groups" class="tab-content">
      <p>Edit the recognised section labels (one per line). Ranges like <code>Verse 1..30</code> are supported.</p>
      <textarea id="group-names" spellcheck="false"></textarea>
      <div class="btn-row">
        <button id="btn-save-groups" class="btn btn-primary">Save Group Names</button>
      </div>
    </section>

    <section class="status-bar">
      <span id="status">Loading Python runtime…</span>
    </section>
  </main>

  <script src="app.js?v=7"></script>
</body>
</html>
